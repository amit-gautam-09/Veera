# fly.toml — always-on single machine with a persistent volume (docs/11-deployment-runbook.md §2)
app = "veera-bot"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VERA_DB_PATH = "/data/vera.db"
  VERA_RESTORE_WINDOW_S = "7200"
  VERA_COMPOSER_MODEL = "claude-sonnet-5"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/v1/healthz"

[mounts]
  source = "vera_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
